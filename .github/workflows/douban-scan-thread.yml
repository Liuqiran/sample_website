name: Probe latest Douban scan thread
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - douban_scan_thread_probe.py
      - .github/workflows/douban-scan-thread.yml
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python douban_scan_thread_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douban-scan-thread
          path: results/douban_scan_thread/
