name: Probe original ChaoFun post
on:
  pull_request:
    branches: [main]
    types: [reopened]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch original post and all comments
        run: python chaofun_original_probe.py
      - name: Commit probe output
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/chaofun_original/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add original ChaoFun post data [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin geo-locate-valle-dorado-20260802
            if git rebase origin/geo-locate-valle-dorado-20260802 && git push origin HEAD:geo-locate-valle-dorado-20260802; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaofun-original-data
          path: results/chaofun_original/
          if-no-files-found: warn
