name: Probe Douban comments
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - douban_comments_probe.py
      - chaofun_media_probe.py
      - .github/workflows/douban-comments.yml
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python douban_comments_probe.py
      - name: Download all original ChaoFun comment images
        run: python chaofun_media_probe.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/douban_comments/
          git commit -m 'Add Douban and ChaoFun comment probe [skip ci]' || true
          git pull --rebase origin geo-locate-valle-dorado-20260802 || true
          git push origin HEAD:geo-locate-valle-dorado-20260802 || true
