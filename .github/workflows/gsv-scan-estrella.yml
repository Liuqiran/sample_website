name: Scan Colonia Estrella Google Street View
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - gsv_scan_estrella.py
      - .github/workflows/gsv-scan-estrella.yml
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scanner dependencies
        run: pip install streetlevel==0.12.10 py360convert==1.0.4 opencv-python-headless==4.11.0.86 numpy==2.2.6 Pillow==11.2.1 requests==2.32.4 scipy
      - name: Enumerate, download, and visually match Street View
        run: python gsv_scan_estrella.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsv-estrella-visual-search
          path: results/gsv_estrella/
          if-no-files-found: warn
          retention-days: 30
