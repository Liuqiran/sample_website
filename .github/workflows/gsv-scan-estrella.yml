name: Scan Colonia Estrella Google Street View
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - gsv_scan_estrella.py
      - gsv_scan_estrella_fast.py
      - .github/workflows/gsv-scan-estrella.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scanner dependencies
        run: pip install streetlevel==0.12.10 py360convert==1.0.4 opencv-python-headless==4.11.0.86 numpy==2.2.6 Pillow==11.2.1 requests==2.32.4 scipy
      - name: Coarse-to-fine Street View match
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/gsv_estrella_fast
          python gsv_scan_estrella_fast.py 2>&1 | tee results/gsv_estrella_fast/run.log
      - name: Commit scanner report to temporary branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/gsv_estrella_fast/ || true
          if git diff --cached --quiet; then
            echo 'No scanner results to commit.'
            exit 0
          fi
          git commit -m 'Add fast Estrella Street View scan results [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin geo-locate-valle-dorado-20260802
            if git rebase origin/geo-locate-valle-dorado-20260802 && git push origin HEAD:geo-locate-valle-dorado-20260802; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsv-estrella-fast-visual-search
          path: results/gsv_estrella_fast/
          if-no-files-found: warn
          retention-days: 30
