name: Full-sequence exact street match
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - geolocate_v2.py
      - data/target_embed.b64
      - config.json
      - .github/workflows/geolocate-v2.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download full KartaView sequences and visually match
        run: python geolocate_v2.py
      - name: Commit v2 report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v2/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'Add full-sequence geolocation results [skip ci]'
            git push origin HEAD:geo-locate-valle-dorado-20260802
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-sequence-geolocation-results
          path: results/v2/
          if-no-files-found: warn
