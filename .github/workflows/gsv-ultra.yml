name: Ultra Street View thumbnail scan
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - gsv_ultra_thumbnail.py
      - .github/workflows/gsv-ultra.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install streetlevel==0.12.10 opencv-python-headless==4.11.0.86 numpy==2.2.6 Pillow==11.2.1 requests==2.32.4
      - name: Scan direct perspective thumbnails
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results/gsv_ultra
          python gsv_ultra_thumbnail.py 2>&1 | tee results/gsv_ultra/run.log
      - name: Commit ultra results
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/gsv_ultra/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add ultra Street View scan results [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin geo-locate-valle-dorado-20260802
            if git rebase origin/geo-locate-valle-dorado-20260802 && git push origin HEAD:geo-locate-valle-dorado-20260802; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsv-ultra-results
          path: results/gsv_ultra/
          if-no-files-found: warn
# retrigger after workflow registration
