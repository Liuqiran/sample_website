name: Target image self-check
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - target_selfcheck.py
      - .github/workflows/target-selfcheck.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy opencv-python-headless
      - run: python target_selfcheck.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/target_selfcheck.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add target self-check [skip ci]'
            git push origin HEAD:geo-locate-valle-dorado-20260802
          fi
