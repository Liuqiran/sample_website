name: Probe Douban topic images
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - douban_probe.py
      - .github/workflows/douban-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow
      - run: python douban_probe.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/douban_candidates/
          if ! git diff --cached --quiet; then
            git commit -m 'Add Douban image candidates [skip ci]'
            git push origin HEAD:geo-locate-valle-dorado-20260802
          fi
