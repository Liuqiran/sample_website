name: Corrected full-sequence exact match v3
on:
  push:
    branches: [geo-locate-valle-dorado-20260802]
    paths:
      - geolocate_v3.py
      - config.json
      - requirements.txt
      - .github/workflows/geolocate-v3.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: geo-locate-valle-dorado-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch complete sequences and match actual target
        run: python geolocate_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-full-sequence-v3
          path: results/v3/
          if-no-files-found: warn
